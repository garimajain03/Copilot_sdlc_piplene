global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector - Copilot Chat metrics forwarded via prometheusexporter
  - job_name: "otel-collector-copilot"
    static_configs:
      - targets: ["localhost:8889"]
        labels:
          source: "copilot-chat"

  # OTel Collector internal metrics (health/performance of the collector itself)
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["localhost:8888"]
