###############################################################################
# OpenTelemetry Collector Configuration
#
# Receives OTLP signals from VS Code Copilot Chat and routes them:
#   - Metrics  → Prometheus exporter (scraped by Prometheus)
#   - Traces   → Debug console (for troubleshooting)
#   - Logs     → Debug console (for troubleshooting)
#
# GenAI Semantic Convention attributes are preserved end-to-end.
#
# Run locally:
#   otelcol-contrib --config=otel-collector-config.yml
###############################################################################

receivers:
  # OTLP receiver – accepts both gRPC (:4317) and HTTP (:4318)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor – buffers signals before export to reduce overhead
  batch:
    send_batch_size: 512
    timeout: 5s

  # Resource detection – adds host/OS metadata to all signals
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 5s
    override: false

  # Attributes processor – enrich spans with custom metadata
  attributes/copilot:
    actions:
      - key: deployment.environment
        value: local
        action: upsert
      - key: telemetry.source
        value: copilot-chat
        action: upsert

  # Memory limiter – prevents OOM under heavy load
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Prometheus exporter – metrics (scraped by Prometheus on :8889)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: copilot
    resource_to_telemetry_conversion:
      enabled: true

  # Debug exporter – logs signals to collector stdout (useful for dev)
  # NOTE: Set to "detailed" temporarily to diagnose missing metric names.
  #       Revert to "basic" once metric discovery is confirmed working.
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  # Health check endpoint for liveness probes
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  pipelines:
    # Traces pipeline: OTLP → batch → debug (no backend storage)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/copilot, batch]
      exporters: [debug]

    # Metrics pipeline: OTLP → batch → Prometheus + debug
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/copilot, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/copilot, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
